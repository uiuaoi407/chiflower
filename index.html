<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>궁원치의 비밀 화원 — 리뉴얼 버전</title>
    
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
            }
        });
    </script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #111; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 8px 0; font-size: 16px; color: #ff79c6; }
        
        #game-container { 
            position: relative; width: 90vw; max-width: 390px; height: 68vh; 
            background: linear-gradient(to bottom, #2c3e50, #1a1a1a); margin: 0 auto 8px auto; border: 3px solid #555; border-radius: 12px; overflow: hidden; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px; box-sizing: border-box;
        }

        #top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; z-index: 5; }
        #day-indicator { font-size: 14px; font-weight: bold; color: #f1c40f; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 15px; }
        
        /* 방 내부 공간 및 창가 영역 */
        #room-area {
            position: relative; width: 100%; height: 45%; 
            background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px;
            display: flex; justify-content: space-around; align-items: center; overflow: hidden;
        }

        /* 창가 (햇빛 주는 곳) */
        .window-zone {
            width: 40%; height: 90%; border-right: 2px solid rgba(255,255,255,0.15);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(241, 196, 15, 0.05); position: relative;
        }
        .window-zone::before { content: "☀️ 창가 (햇빛존)"; font-size: 10px; color: #f1c40f; position: absolute; top: 5px; }

        /* 화분/꽃 아이템 (드래그 가능) */
        #flower-object {
            font-size: 55px; cursor: grab; z-index: 10; transition: transform 0.2s;
            user-select: none; position: absolute;
        }
        #flower-object:active { cursor: grabbing; }

        /* 궁원치 캐릭터/짤방 영역 */
        #character-avatar {
            position: absolute; bottom: 8px; left: 10px; display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 10px; border: 1px solid #666;
            z-index: 6;
        }
        #avatar-img { font-size: 28px; }
        #avatar-speech { font-size: 11px; color: #ddd; text-align: left; max-width: 170px; }

        #dialogue-box { 
            width: 100%; background: rgba(0,0,0,0.8); border: 2px solid #555; border-radius: 8px; 
            padding: 8px; font-size: 12px; line-height: 1.3; min-height: 40px; box-sizing: border-box; color: #ddd;
        }

        #action-panel { display: flex; gap: 6px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .game-btn { 
            padding: 8px 12px; font-size: 12px; cursor: pointer; background: #2980b9; color: white; 
            border: none; border-radius: 6px; font-weight: bold; flex: 1; min-width: 70px;
        }
        .game-btn:active { background: #1f618d; }
        .danger-btn { background: #c0392b; }

        #watermark { position: absolute; bottom: 4px; right: 8px; color: rgba(255, 255, 255, 0.4); font-size: 9px; pointer-events: none; }

        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.88);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; padding: 20px; box-sizing: border-box;
        }
        .screen-overlay h2 { font-size: 20px; color: #f39c12; margin-bottom: 8px; }
        .screen-overlay p { font-size: 12px; line-height: 1.4; color: #ccc; margin-bottom: 15px; }
        .start-btn { padding: 10px 30px; font-size: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🌿 궁원치의 비밀 화원 (리뉴얼) 🌿</h1>

    <div id="game-container">
        <div id="top-bar">
            <div id="day-indicator">DAY 1 / 3</div>
            <div style="font-size: 11px; color: #aaa;">💡 꽃을 창가로 드래그해보세요!</div>
        </div>

        <!-- 방 내부 & 창가 공간 -->
        <div id="room-area">
            <div class="window-zone" id="window-zone"></div>
            <div style="width: 60%; height: 100%; display: flex; align-items: center; justify-content: center;"></div>
            <!-- 드래그할 꽃 화분 -->
            <div id="flower-object">🌱</div>
        </div>

        <!-- 궁원치 캐릭터 짤방/아바타 공간 -->
        <div id="character-avatar">
            <div id="avatar-img">🧐</div>
            <div id="avatar-speech">음... 어떻게 키워야 잘 자란다고 소문이 날까.</div>
        </div>

        <div id="dialogue-box">
            방 안에서 씨앗을 심었다. 정성을 다해 돌봐주자.
        </div>

        <!-- 액션 버튼 -->
        <div id="action-panel">
            <button class="game-btn" onclick="doAction('water')">💧 물 주기</button>
            <button class="game-btn" onclick="openMedicineMenu()">🧪 탕약 만들기</button>
        </div>

        <div id="watermark">모카크림의 밤산책</div>

        <!-- 시작 화면 -->
        <div id="start-screen" class="screen-overlay">
            <h2>궁원치의 비밀 화원</h2>
            <p>방 안에서 꽃을 키우고, 창가로 직접 드래그해서 햇빛을 쬐어주세요!<br>형님에게 줄 최고의 꽃을 피우는 3일 간의 대장정.</p>
            <button class="start-btn" onclick="startGame()">입장하기</button>
        </div>

        <!-- 밤 오버레이 -->
        <div id="night-screen" class="screen-overlay" style="display: none;">
            <h2>🌙 밤이 깊어졌습니다...</h2>
            <p id="night-text">오늘 하루의 관리를 마쳤습니다.</p>
            <button class="start-btn" onclick="nextDay()">다음 날 아침으로</button>
        </div>

        <!-- 엔딩 오버레이 -->
        <div id="ending-screen" class="screen-overlay" style="display: none;">
            <h2>🌺 COMPLETE 🌺</h2>
            <p id="ending-text">만개한 꽃을 꺾어 들고 형님에게 향한다...</p>
            <button class="start-btn" onclick="resetGame()">다시 하기</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
